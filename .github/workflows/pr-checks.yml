name: PR validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    name: Shared checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Select platform tests
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/pr-checks.mjs scope
      - name: Verify versions and shared assets
        run: |
          node tools/check-versions.mjs
          node tools/sync-runtime-assets.mjs --check
          node --test tools/*.test.mjs
          node macos/scripts/injector.mjs --check-payload
          node windows/scripts/injector.mjs --check-payload
  macos:
    name: macOS tests
    needs: shared
    if: needs.shared.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test macOS runtime and native app
        env:
          CODEX_DREAM_SKIN_SKIP_SIGNED_RUNTIME_TESTS: '1'
          CODEX_DREAM_SKIN_SKIP_DOCTOR: '1'
        run: NODE="$(command -v node)" bash macos/tests/run-tests.sh
  windows:
    name: Windows tests
    needs: shared
    if: needs.shared.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '8.0.x'
      - name: Test Windows runtime
        shell: bash
        run: node --test windows/tests/*.test.mjs
      - name: Test native theme manager
        shell: pwsh
        run: |
          dotnet run --configuration Release --project windows/theme-manager/Tests/DreamSkin.ThemeManager.Tests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Theme-manager tests failed' }
          dotnet run --configuration Release --project windows/theme-manager/NativeTests/DreamSkin.ThemeManager.NativeTests.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows tests failed' }
          node tools/build-theme-manager.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Theme-manager build failed' }
      - name: Test Windows scripts and installer contract
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy RemoteSigned -File windows/tests/run-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy RemoteSigned -File windows/tests/installer-static.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer tests failed' }
  gate:
    name: PR checks
    needs: [shared, macos, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Require every selected check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/pr-checks.mjs gate
